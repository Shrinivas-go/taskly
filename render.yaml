# Render Blueprint Specification (₹0 Free Tier Deployment)
# Documentation: https://render.com/docs/blueprint-spec
#
# Services deployed on Render:
#   - taskly-backend:  NestJS 10 + Prisma ORM (Web Service)
#   - taskly-ai:       FastAPI Python 3.11 microservice (Web Service)
#
# Frontend is hosted on Vercel (https://vercel.com) for edge CDN performance.
# All services use the Free tier (plan: free) -> Total Cost: ₹0 / month.

version: "1"

services:
  # ==============================================================================
  # 1. NestJS Backend Web Service (Free Tier)
  # - 512 MB RAM, 0.1 CPU
  # - Sleeps after 15 min inactivity; wakes on incoming HTTP request
  # - Automatic HTTPS on https://taskly-backend.onrender.com
  # ==============================================================================
  - type: web
    name: taskly-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate --schema=backend/prisma/schema.prisma && npm run build --workspace=backend
    startCommand: npx prisma migrate deploy --schema=backend/prisma/schema.prisma && npm run start:prod --workspace=backend
    healthCheckPath: /api/v1/health
    buildFilter:
      paths:
        - backend/**
        - package.json
        - package-lock.json
      ignoredPaths:
        - frontend/**
        - ai-service/**
        - docs/**
        - "*.md"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: PostgreSQL connection URL from Neon or Supabase free tier
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a cryptographically secure random string
      - key: FRONTEND_URL
        sync: false # Set in Render Dashboard: your Vercel frontend URL, e.g. https://your-project.vercel.app
      - key: CORS_ORIGINS
        sync: false # Set in Render Dashboard: your Vercel frontend URL, e.g. https://your-project.vercel.app
      - key: AI_SERVICE_URL
        value: https://taskly-ai.onrender.com
      - key: AI_SERVICE_TIMEOUT
        value: 35000
      - key: GOOGLE_CLIENT_ID
        value: 110254728311-acfug1luj2l7m68l3katijarqtmb01mu.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Set in Render Dashboard: your Google OAuth client secret
      - key: GOOGLE_CALLBACK_URL
        value: https://taskly-backend-rsdd.onrender.com/api/v1/auth/google/callback

  # ==============================================================================
  # 2. FastAPI AI Microservice (Free Tier)
  # - 512 MB RAM, 0.1 CPU
  # - Python 3.11 runtime, isolated inside ai-service directory
  # - Automatic HTTPS on https://taskly-ai.onrender.com
  # ==============================================================================
  - type: web
    name: taskly-ai
    runtime: python
    plan: free
    region: oregon
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    buildFilter:
      paths:
        - ai-service/**
      ignoredPaths:
        - backend/**
        - frontend/**
        - docs/**
        - "*.md"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_PROVIDER
        value: mock
      - key: AI_SERVICE_HOST
        value: 0.0.0.0
      - key: AI_SERVICE_PORT
        value: 10000
      - key: AI_API_KEY
        sync: false # Optional: Set in Render Dashboard only if using OpenAI or Groq
      - key: NESTJS_BACKEND_URL
        value: https://taskly-backend-rsdd.onrender.com
