apiVersion: v1
kind: ConfigMap
metadata:
  name: todoist-config
  labels:
    app.kubernetes.io/name: todoist
    app.kubernetes.io/part-of: todoist-application
data:
  NODE_ENV: "production"
  BACKEND_PORT: "4000"
  FRONTEND_PORT: "3000"
  AI_SERVICE_PORT: "8000"
  API_PREFIX: "api/v1"
  JWT_EXPIRES_IN: "7d"
  AI_SERVICE_URL: "http://ai-service:8000"
  AI_SERVICE_TIMEOUT: "35000"
  AI_PROVIDER: "mock"
  AI_MODEL: "gpt-4o-mini"
  CORS_ORIGINS: "http://localhost:3000"
  NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
