apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: todoist-application
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: todoist/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: todoist-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: todoist-config
                  key: BACKEND_PORT
            - name: API_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: todoist-config
                  key: API_PREFIX
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: todoist-config
                  key: JWT_EXPIRES_IN
            - name: AI_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: todoist-config
                  key: AI_SERVICE_URL
            - name: AI_SERVICE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: todoist-config
                  key: AI_SERVICE_TIMEOUT
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: todoist-config
                  key: CORS_ORIGINS
            # Sensitive configuration injected from Kubernetes Secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todoist-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: todoist-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
