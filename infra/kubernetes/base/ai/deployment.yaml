apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deployment
  labels:
    app.kubernetes.io/name: ai
    app.kubernetes.io/component: ai-service
    app.kubernetes.io/part-of: todoist-application
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai
      app.kubernetes.io/component: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai
        app.kubernetes.io/component: ai-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: ai-service
          image: todoist/ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: AI_SERVICE_HOST
              value: "0.0.0.0"
            - name: AI_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: todoist-config
                  key: AI_SERVICE_PORT
            - name: AI_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: todoist-config
                  key: AI_PROVIDER
            - name: AI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: todoist-config
                  key: AI_MODEL
            # Sensitive provider key injected from Kubernetes Secret
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: todoist-secrets
                  key: AI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
