apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate-job
  labels:
    app.kubernetes.io/name: database-migration
    app.kubernetes.io/component: migration-job
    app.kubernetes.io/part-of: todoist-application
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migration
        app.kubernetes.io/component: migration-job
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: prisma-migrate
          image: todoist/backend:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - npx
            - prisma
            - migrate
            - deploy
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              value: "production"
            # Target environment database URL securely injected from Secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todoist-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
