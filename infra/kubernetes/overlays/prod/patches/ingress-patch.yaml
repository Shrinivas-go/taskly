apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todoist-ingress
spec:
  rules:
  - host: todoist.example.com
    http:
      paths:
      - backend:
          service:
            name: backend-service
            port:
              number: 4000
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: web-service
            port:
              number: 3000
        path: /
        pathType: Prefix
