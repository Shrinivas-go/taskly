apiVersion: v1
kind: ConfigMap
metadata:
  name: todoist-config
data:
  NODE_ENV: "development"
  BACKEND_PORT: "4000"
  FRONTEND_PORT: "3000"
  AI_PORT: "8000"
  NEXT_PUBLIC_API_URL: "http://localhost:4000"
  AI_SERVICE_URL: "http://ai-service.todoist-dev.svc.cluster.local:8000"
  AI_SERVICE_TIMEOUT: "15000"
  CORS_ORIGINS: "http://localhost:3000,http://dev.todoist.example.com"
  AI_PROVIDER: "mock"
  AI_MODEL: "mock-model"
