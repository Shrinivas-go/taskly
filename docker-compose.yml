services:
  postgres:
    image: postgres:16-alpine
    container_name: todoist-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todoist_dev}
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-todoist_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todoist-network

  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: todoist-ai-service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      AI_SERVICE_HOST: "0.0.0.0"
      AI_SERVICE_PORT: "8000"
      AI_PROVIDER: "${AI_PROVIDER:-mock}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-gpt-4o-mini}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - todoist-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: todoist-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: "postgresql://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-todoist_dev}?schema=public&sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-dev_jwt_secret_key_change_in_production_123456789}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-7d}"
      AI_SERVICE_URL: "http://ai:8000"
      AI_SERVICE_TIMEOUT: "35000"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - todoist-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}"
    container_name: todoist-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - todoist-network

volumes:
  pgdata:
    driver: local

networks:
  todoist-network:
    driver: bridge
